  <style>
    /* homework list: one entry per homework, picture alternating left and right */
    .hw-list { display: grid; gap: 22px; max-width: 860px; margin-inline: auto; }
    .hw-list .hw-entry { --visual-w: 280px; display: grid; grid-template-columns: var(--visual-w) minmax(0, 1fr); grid-auto-rows: minmax(200px, auto); padding: 0; overflow: hidden; }
    .hw-entry.reverse { grid-template-columns: minmax(0, 1fr) var(--visual-w); }
    .hw-entry.reverse .hw-visual { order: 2; border-right: 0; border-left: 1px solid var(--border); }
    .hw-visual { display: grid; place-items: center; background: var(--surface-2); border-right: 1px solid var(--border); }
    .hw-body { padding: 26px 30px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
    .hw-body h2 { font-size: clamp(1.7rem, 3.2vw, 2.2rem); letter-spacing: -0.02em; margin: 0; }
    .hw-sub { margin: 0; color: var(--ink-2); font-size: 1.05rem; }
    .hw-parts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .hw-parts li + li { margin-top: 0; }
    .hw-parts a {
      display: flex; align-items: baseline; gap: 10px; padding: 6px 10px; margin-left: -10px; border-radius: 8px;
      color: var(--ink-2); font-size: 1.05rem; text-decoration: none; transition: background .15s, color .15s;
    }
    .hw-parts a::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); transform: translateY(-2px); }
    .hw-parts a::after { content: "→"; margin-left: auto; padding-left: 8px; color: var(--muted); opacity: 0; transform: translateX(-4px); transition: opacity .15s, transform .15s; }
    .hw-parts a:hover { background: var(--surface-2); color: var(--ink); }
    .hw-parts a:hover::after, .hw-parts a:focus-visible::after { opacity: 1; transform: none; }
    .hw-parts .part { font: 600 0.78rem/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-ink); white-space: nowrap; }
    @media (max-width: 720px) {
      .hw-list .hw-entry, .hw-list .hw-entry.reverse { grid-template-columns: minmax(0, 1fr); grid-auto-rows: auto; }
      .hw-entry .hw-visual, .hw-entry.reverse .hw-visual { order: 0; border: 0; border-bottom: 1px solid var(--border); min-height: 180px; }
      .hw-body { padding: 20px 22px 22px; }
    }
    .curve-mini { width: 200px; height: 180px; }
    .curve-mini .g { stroke: var(--grid); stroke-width: 1; }
    .curve-mini .s { fill: var(--series-1); }
    .curve-mini .o { fill: var(--axis); }
    .curve-mini .l { stroke: var(--series-2); stroke-width: 1.6; opacity: .85; }
    .course { color: var(--muted); font-size: 0.95rem; margin-bottom: 10px; }
    .freq-mini { width: 218px; height: 176px; }
    .freq-mini text { font: 10px var(--sans); fill: var(--muted); }
    .freq-mini text.k { font: 600 10px var(--mono); fill: var(--ink-2); }
    .freq-mini .g { stroke: var(--axis); stroke-width: 1; }
    .freq-mini .p { fill: var(--series-1); }
    .freq-mini .c { fill: var(--series-2); }
  </style>
</head>
